<div class="payment-method" data-bind="attr: {id: getCode() +'_wrapper'}, css: {'_active': (getCode() == isChecked())}">
    <div class="payment-method-title field choice">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible()"/>
        <label data-bind="attr: {'for': getCode()}" class="label"><span data-bind="text: getTitle()"></span></label>
    </div>
    <div class="payment-method-content">
        <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!--/ko-->
        <div class="payment-method-billing-address">
            <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>

        <form class="form" data-bind="mageInit: {'validation': {}}, attr: {'id': getCode() + '-form'}">
            <fieldset class="fieldset" data-bind='attr: {id: "payment_form_" + getCode()}'>
                <div class="field required">
                    <label data-bind="attr: {for: getCode() + '_name_on_account'}" class="label">
                        <span><!-- ko i18n: 'Name  On Account'--><!-- /ko --></span>
                    </label>
                    <div class="control">
                        <input type="text" name="payment[name_on_account]" class="input-text" value=""
                               data-bind="attr: {
                                            id: getCode() + '_name_on_account',
                                            title: $t('Name  On Account'),
                                            'data-container': getCode() + '-name_on_account',
                                            'data-validate': JSON.stringify({'required-number':true})},
                                            enable: isActive($parents),
                                            value: nameOnAccount" />
                    </div>
                </div>

                <div class="field required">
                    <label data-bind="attr: {for: getCode() + '_account_type'}" class="label">
                        <span><!-- ko i18n: 'Account Type'--><!-- /ko --></span>
                    </label>
                    <div class="control">
                        <select name="payment[account_type]"
                                class="select select-year"
                                data-bind="attr: {id: getCode() + '_account_type', 'data-container': getCode() + '-account_type', 'data-validate': JSON.stringify({required:true})},
                                           enable: isActive($parents),
                                           options: getAccountTypesValues(),
                                           optionsValue: 'value',
                                           optionsText: 'label',
                                           optionsCaption: $t('Select Account Type'),
                                           value: accountType">
                        </select>
                    </div>
                </div>

                <div class="field number required">
                    <label data-bind="attr: {for: getCode() + '_account_number'}" class="label">
                        <span><!-- ko i18n: 'Account Number'--><!-- /ko --></span>
                    </label>
                    <div class="control">
                        <input type="text" name="payment[account_number]" class="input-text" value=""
                               data-bind="attr: {
                                            id: getCode() + '_account_number',
                                            title: $t('Account Number'),
                                            'data-container': getCode() + '-account_number',
                                            'data-validate': JSON.stringify({'required-number':true})},
                                            enable: isActive($parents),
                                            value: accountNumber"/>
                    </div>
                </div>

                <div class="field number required">
                    <label data-bind="attr: {for: getCode() + '_routing_number'}" class="label">
                        <span><!-- ko i18n: 'Routing Number'--><!-- /ko --></span>
                    </label>
                    <div class="control">
                        <input type="text" name="payment[routing_number]" class="input-text" value=""
                               data-bind="attr: {
                                            id: getCode() + '_routing_number',
                                            title: $t('Routing Number'),
                                            'data-container': getCode() + '-routing_number',
                                            'data-validate': JSON.stringify({'required-number':true})},
                                            enable: isActive($parents),
                                            value: routingNumber"/>
                    </div>
                </div>
            </fieldset>
        </form>

        <!-- ko if: (showNote())-->
            <fieldset class="fieldset" data-bind="attr: {id: getCode() + '_top_msg'}">
                <div class="payment-method-note" data-bind="text: getTopNote()"></div>
            </fieldset>
        <!-- /ko -->

        <div class="checkout-agreements-block">
            <!-- ko foreach: $parent.getRegion('before-place-order') -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
        <div class="actions-toolbar">
            <div class="primary">
                <button class="action primary checkout checkout g-recaptcha"
                        data-sitekey="value: cSiteKey()"
                        type="submit"
                        data-bind="
                        click: placeOrder,
                        attr: {title: $t('Place Order')},
                        css: {disabled: !isPlaceOrderActionAllowed()},
                        enable: (getCode() == isChecked())
                        "
                        disabled>
                    <span data-bind="text: $t('Place Order')"></span>
                </button>
            </div>
        </div>
    </div>
</div>
